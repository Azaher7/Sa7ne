# Netlify configuration for Sa7ne
# This is a plain static HTML/CSS/JS site — there is no build step.
# Netlify simply publishes the repository root as-is.

[build]
  publish = "."
  # No build command: nothing to compile. Decap CMS commits content changes
  # directly to the repo, and Netlify redeploys the static files.

# Cache images aggressively (studio photos + CMS uploads both live here)...
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ...but keep editable content fresh so CMS edits appear right after deploy.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
